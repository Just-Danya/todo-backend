version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: todo-postgres
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - todo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment this section when you want to run the Spring Boot app in Docker
  # todo-backend:
  #   build: .
  #   container_name: todo-backend
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/todo_db
  #     SPRING_DATASOURCE_USERNAME: todo_user
  #     SPRING_DATASOURCE_PASSWORD: todo_password
  #   networks:
  #     - todo-network

volumes:
  postgres_data:

networks:
  todo-network:
    driver: bridge